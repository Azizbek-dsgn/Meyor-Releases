name: Build UzScribe update
on:
  workflow_dispatch:
    inputs:
      version:
        description: UzScribe versiyasi (release-uzscribe.sh chiqargan)
        required: true
      input_sha256:
        description: Shifrlangan input SHA-256 (release-uzscribe.sh chiqargan)
        required: true
permissions:
  contents: read
concurrency:
  group: product-release
  cancel-in-progress: false
env:
  UZSCRIBE_VERSION: ${{ inputs.version }}
  INPUT_SHA256: ${{ inputs.input_sha256 }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win-x64
          - os: macos-15
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install cryptography Cython==3.1.8 setuptools==80.9.0 tqdm
      - name: Authenticate encrypted source input
        shell: bash
        env:
          MEYOR_BUILD_KEY: ${{ secrets.MEYOR_BUILD_KEY }}
        run: python build-tools/decrypt-uzscribe.py
      - name: Build and test protected UzScribe
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/product-release"
          cd "$RUNNER_TEMP/meyor-private-build/uzscribe"
          package="$RUNNER_TEMP/product-release/UzScribe-$UZSCRIBE_VERSION-$PLATFORM.zip"
          npm install --ignore-scripts --prefix packaging javascript-obfuscator@4.1.1 > "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python packaging/build-uzscribe.py --source . --version "$UZSCRIBE_VERSION" --revision "$SOURCE_REVISION" --output "$package" >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python -m pip install Pillow numpy av==18.1.0 imageio-ffmpeg==0.6.0 uv==0.13.0 >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall('native-smoke')" "$package"
          python packaging/validate-desktop-package.py native-smoke "$RUNNER_TEMP/product-release/desktop-test.json" >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python -m unittest tests.test_dictation >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          if [ "$PLATFORM" = win-x64 ]; then
            python packaging/validate-windows-bootstrap.py native-smoke "$RUNNER_TEMP/product-release/windows-bootstrap.json" >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          fi
          echo "$SOURCE_REVISION" > "$RUNNER_TEMP/product-release/SOURCE_REVISION"
      - name: Encrypt failure diagnostics
        if: failure()
        shell: bash
        env:
          MEYOR_BUILD_KEY: ${{ secrets.MEYOR_BUILD_KEY }}
        run: python build-tools/encrypt-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UzScribe-diagnostics-${{ matrix.platform }}
          retention-days: 3
          path: ${{ runner.temp }}/encrypted-diagnostics/*.enc
      - uses: actions/upload-artifact@v4
        with:
          name: UzScribe-release-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: ${{ runner.temp }}/product-release/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UzScribe-release-win-x64
          path: downloads/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: UzScribe-release-mac-arm64
          path: downloads/mac-arm64
      - uses: actions/download-artifact@v4
        with:
          name: UzScribe-release-mac-x64
          path: downloads/mac-x64
      - name: Publish verified binary releases and update catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export SOURCE_REVISION="$(cat downloads/mac-arm64/SOURCE_REVISION)"
          for p in win-x64 mac-x64; do [ "$(cat downloads/$p/SOURCE_REVISION)" = "$SOURCE_REVISION" ]; done
          python build-tools/publish-uzscribe.py
