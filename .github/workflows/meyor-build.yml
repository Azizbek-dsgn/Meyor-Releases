name: Build Meyor desktop
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, win-x64]
      version:
        description: Meyor versiyasi (encrypt-source.py chiqargan)
        required: true
      input_sha256:
        description: Shifrlangan input SHA-256
        required: true
permissions:
  contents: read
env:
  PRODUCT: meyor
  PRODUCT_VERSION: ${{ inputs.version }}
  INPUT_SHA256: ${{ inputs.input_sha256 }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'win-x64' && '[{"os":"windows-2022","platform":"win-x64","target":"win","arch":"x64"}]' || '[{"os":"windows-2022","platform":"win-x64","target":"win","arch":"x64"},{"os":"macos-15","platform":"mac-arm64","target":"mac","arch":"arm64"},{"os":"macos-15-intel","platform":"mac-x64","target":"mac","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install build dependencies
        run: python -m pip install cryptography
      - name: Authenticate and decrypt build input
        env:
          MEYOR_BUILD_KEY: ${{ secrets.MEYOR_BUILD_KEY }}
        shell: bash
        run: python build-tools/decrypt-meyor.py
      - name: Build and test protected Meyor
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd "$RUNNER_TEMP/meyor-private-build/meyor"
          pnpm install --frozen-lockfile --ignore-scripts > "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          node node_modules/electron/install.js >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          pnpm check >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          pnpm test >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          if [ "$PLATFORM" = win-x64 ]; then
            node scripts/windows-python-smoke.cjs >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          fi
          pnpm dist --"$TARGET" --"$ARCH" >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          node scripts/check-package.cjs >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'meyor-private-build/meyor'
          Set-Location $project
          $installer = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Meyor installed with spaces'
          $p = Start-Process $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Windows installation failed' }
          node scripts/smoke-app.cjs "$destination/Meyor.exe" "$env:RUNNER_TEMP/Meyor-smoke-results" *> "$env:RUNNER_TEMP/meyor-private-ui.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows application test failed' }
          $p = Start-Process $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Windows reinstall failed' }
      - name: Mac installer smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd "$RUNNER_TEMP/meyor-private-build/meyor"
          export MEYOR_INSTALL_DIR="$RUNNER_TEMP/Meyor installed with spaces"
          FILE="dist/Meyor-$PRODUCT_VERSION-mac-$ARCH.dmg"
          SHA=$(shasum -a 256 "$FILE" | awk '{print $1}')
          bash scripts/install-mac.sh "$FILE" "$SHA" > "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          node scripts/smoke-app.cjs "$MEYOR_INSTALL_DIR/Meyor.app/Contents/MacOS/Meyor" "$RUNNER_TEMP/Meyor-smoke-results" >> "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          bash scripts/install-mac.sh "$FILE" "$SHA" >> "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          cp scripts/install-mac.sh dist/Install-Meyor-mac.sh
      - name: Encrypt failure diagnostics
        if: failure()
        shell: bash
        env:
          MEYOR_BUILD_KEY: ${{ secrets.MEYOR_BUILD_KEY }}
        run: python build-tools/encrypt-diagnostics.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Encrypted-diagnostics-${{ matrix.platform }}
          retention-days: 3
          path: ${{ runner.temp }}/encrypted-diagnostics/*.enc
      - uses: actions/upload-artifact@v4
        with:
          name: Meyor-release-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/meyor-private-build/meyor/dist/*.dmg
            ${{ runner.temp }}/meyor-private-build/meyor/dist/*.exe
            ${{ runner.temp }}/meyor-private-build/meyor/dist/Install-Meyor-mac.sh
            ${{ runner.temp }}/meyor-private-build/meyor/SOURCE_REVISION
            ${{ runner.temp }}/Meyor-smoke-results/*.json
            ${{ runner.temp }}/Meyor-smoke-results/*.png
  publish:
    needs: build
    if: inputs.platform == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Meyor-release-*
          path: downloads
      - name: Publish Meyor release and update catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build-tools/publish-meyor.py
