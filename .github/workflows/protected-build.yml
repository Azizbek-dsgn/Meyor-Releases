name: Build encrypted Meyor distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win-x64
            target: win
            arch: x64
          - os: macos-15
            platform: mac-arm64
            target: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac-x64
            target: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install build dependencies
        run: python -m pip install cryptography Cython==3.1.8 setuptools==80.9.0 tqdm
      - name: Authenticate and decrypt build input
        env:
          MEYOR_BUILD_KEY: ${{ secrets.MEYOR_BUILD_KEY }}
        shell: bash
        run: python build-tools/decrypt-input.py
      - name: Build and test protected native UzScribe
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          cd "$RUNNER_TEMP/meyor-private-build/uzscribe"
          npm install --ignore-scripts --prefix packaging > "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python packaging/build-uzscribe.py --source . --version 0.8.5 --revision 10190925d294d99eb9c79c569c7c7641b1cc300b --output "dist/UzScribe-0.8.5-$PLATFORM.zip" >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python -m pip install Pillow numpy av==18.1.0 imageio-ffmpeg==0.6.0 uv==0.13.0 >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('native-smoke')"
          python packaging/validate-desktop-package.py native-smoke "desktop-results/$PLATFORM.json" >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          if [ "$PLATFORM" = win-x64 ]; then
            python packaging/validate-windows-bootstrap.py native-smoke desktop-results/windows-bootstrap.json >> "$RUNNER_TEMP/uzscribe-private-build.log" 2>&1
          fi
      - name: Build and test protected Meyor
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd "$RUNNER_TEMP/meyor-private-build/meyor"
          pnpm install --frozen-lockfile --ignore-scripts > "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          node node_modules/electron/install.js >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          pnpm check >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          pnpm test >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          if [ "$PLATFORM" = win-x64 ]; then
            node scripts/windows-python-smoke.cjs >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          fi
          pnpm dist --"$TARGET" --"$ARCH" >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
          node scripts/check-package.cjs >> "$RUNNER_TEMP/meyor-private-build.log" 2>&1
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'meyor-private-build/meyor'
          Set-Location $project
          $installer = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'Meyor installed with spaces'
          $p = Start-Process $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Windows installation failed' }
          node scripts/smoke-app.cjs "$destination/Meyor.exe" "$env:RUNNER_TEMP/Meyor-smoke-results" *> "$env:RUNNER_TEMP/meyor-private-ui.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows application test failed' }
          $p = Start-Process $installer -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Windows reinstall failed' }
      - name: Mac installer smoke
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd "$RUNNER_TEMP/meyor-private-build/meyor"
          export MEYOR_INSTALL_DIR="$RUNNER_TEMP/Meyor installed with spaces"
          FILE="dist/Meyor-0.3.1-mac-$ARCH.dmg"
          SHA=$(shasum -a 256 "$FILE" | awk '{print $1}')
          bash scripts/install-mac.sh "$FILE" "$SHA" > "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          node scripts/smoke-app.cjs "$MEYOR_INSTALL_DIR/Meyor.app/Contents/MacOS/Meyor" "$RUNNER_TEMP/Meyor-smoke-results" >> "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          bash scripts/install-mac.sh "$FILE" "$SHA" >> "$RUNNER_TEMP/meyor-private-ui.log" 2>&1
          cp scripts/install-mac.sh dist/Install-Meyor-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Protected-release-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/meyor-private-build/meyor/dist/*.dmg
            ${{ runner.temp }}/meyor-private-build/meyor/dist/*.exe
            ${{ runner.temp }}/meyor-private-build/meyor/dist/Install-Meyor-mac.sh
            ${{ runner.temp }}/meyor-private-build/uzscribe/dist/*.zip
            ${{ runner.temp }}/meyor-private-build/uzscribe/desktop-results/*.json
            ${{ runner.temp }}/Meyor-smoke-results/*.json
            ${{ runner.temp }}/Meyor-smoke-results/*.png
